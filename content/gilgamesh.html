<span class="mini-label">THE EPIC OF GILGAMESH</span>
<h3 id="gilgamesh-epic">吉尔伽美什史诗</h3>
<p class="epic-verse">他曾远行，寻求永生。<br>也曾失去挚友，独自穿越荒野。<br>归来时，乌鲁克的城墙仍在。<br>故事被写下，留给后来的人。</p>
